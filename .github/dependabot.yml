version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/projects/ngx-google-analytics"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      angular-version:
        applies-to: version-updates
        patterns:
          - "@angular*"
        update-types:
          - "minor"
          - "patch"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@angular*"
        update-types: ["version-update:semver-major"]
